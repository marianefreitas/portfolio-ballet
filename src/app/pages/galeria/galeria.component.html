<div class="galeria-page-wrapper">
  
  <!-- HERO DA GALERIA -->
  <div class="fade-in">
    <app-gallery-hero></app-gallery-hero>
  </div>

  <!-- BARRA DE FERRAMENTAS E FILTROS -->
  <div class="fade-in delay-1">
    <app-gallery-toolbar
      [activeDimension]="activeDimension"
      [searchQuery]="searchQuery"
      (dimensionChange)="onDimensionChange($event)"
      (searchQueryChange)="onSearchQueryChange($event)">
    </app-gallery-toolbar>
  </div>

  <!-- GRID DE GRUPOS/COLEÇÕES DE MÍDIA -->
  <div class="fade-in delay-2">
    <app-gallery-groups
      [groups]="filteredGroups"
      [highlightedGroupId]="highlightedGroupId"
      (groupClick)="openViewer($event)">
    </app-gallery-groups>
  </div>

  <!-- LIGHTBOX / VISUALIZADOR DE MÍDIA DETALHADA -->
  <!-- Mantido fora dos containers com transform/fade-in para permitir position: fixed relativo ao viewport -->
  <app-gallery-viewer
    [group]="selectedGroup"
    (close)="closeViewer()">
  </app-gallery-viewer>

  <!-- FAIXA DE CITAÇÃO FINAL (Rodapé decorativo inspirado no mockup) -->
  <div class="fade-in delay-3">
    <section class="gallery-quote-ribbon">
      <div class="quote-container">
        <div class="quote-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="quote-svg">
            <path d="M6 3c1 2 2 5 2 8s-2 5-2 8c0 2 1.5 3 3 3s2.5-2 3-5M18 3c-1 2-2 5-2 8s2 5 2 8c0 2-1.5 3-3 3s-2.5-2-3-5"/>
            <path d="M12 3c-1 2-2 3-3 3s-2.5-1-3-2M12 3c1 2 2 3 3 3s2.5-1 3-2"/>
          </svg>
        </div>
        <div class="quote-text-wrapper">
          <p class="quote-main">Cada imagem carrega uma história.</p>
          <p class="quote-sub">Cada história nos inspira a continuar dançando.</p>
        </div>
      </div>
    </section>
  </div>

</div>
